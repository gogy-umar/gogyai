    <circle cx="16" cy="94" r="8" stroke="#ca8a04" strokeWidth="1.5"/>
    <rect x="30" y="91" width="46" height="4" rx="2" fill="#94a3b8"/>
    <rect x="30" y="98" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
